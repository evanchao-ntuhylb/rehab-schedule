<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>復健治療排程系統</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg-primary: #ffffff; --bg-secondary: #f5f5f3; --bg-tertiary: #eeede9;
    --text-primary: #1a1a18; --text-secondary: #6b6b67; --text-tertiary: #9b9b97;
    --border-light: rgba(0,0,0,0.12); --border-mid: rgba(0,0,0,0.22);
    --radius-md: 8px; --radius-lg: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg-primary: #1e1e1c; --bg-secondary: #2a2a28; --bg-tertiary: #333330;
      --text-primary: #f0ede8; --text-secondary: #a0a09a; --text-tertiary: #6b6b65;
      --border-light: rgba(255,255,255,0.1); --border-mid: rgba(255,255,255,0.2);
    }
  }
  body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg-tertiary); color: var(--text-primary); min-height: 100vh; }

  /* ── 登入畫面 ── */
  #login-screen {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 1rem;
  }
  .login-card {
    background: var(--bg-primary); border: 0.5px solid var(--border-light);
    border-radius: var(--radius-lg); padding: 2rem 2rem 1.75rem; width: 100%; max-width: 360px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.07);
  }
  .login-card h2 { font-size: 17px; font-weight: 500; margin-bottom: 4px; }
  .login-card p { font-size: 12px; color: var(--text-secondary); margin-bottom: 1.5rem; }
  .login-field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
  .login-field label { font-size: 12px; color: var(--text-secondary); }
  .login-field input {
    font-size: 13px; height: 38px; padding: 0 12px;
    border-radius: var(--radius-md); border: 0.5px solid var(--border-mid);
    background: var(--bg-primary); color: var(--text-primary);
  }
  .login-field input:focus { outline: none; border-color: #378ADD; box-shadow: 0 0 0 2px rgba(55,138,221,0.15); }
  .login-btn {
    margin-top: 8px; width: 100%; padding: 10px; border-radius: var(--radius-md);
    border: none; background: #378ADD; color: #fff;
    font-size: 13px; font-weight: 500; cursor: pointer; transition: background 0.15s;
  }
  .login-btn:hover { background: #2a6fba; }
  .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .login-err { font-size: 12px; color: #A32D2D; background: #FCEBEB; border-radius: var(--radius-md); padding: 6px 10px; margin-top: 10px; display: none; }

  /* ── 主畫面 ── */
  #main-screen { display: none; padding: 1.5rem 1rem; }
  .container { max-width: 960px; margin: 0 auto; }
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 10px; }
  h1 { font-size: 20px; font-weight: 500; display: flex; align-items: center; gap: 10px; }
  .sync-status { font-size: 12px; font-weight: 400; padding: 3px 10px; border-radius: 20px; display: inline-flex; align-items: center; gap: 5px; }
  .sync-status.connected { background: #EAF3DE; color: #3B6D11; }
  .sync-status.connecting { background: #FAEEDA; color: #854F0B; }
  .sync-status.error { background: #FCEBEB; color: #A32D2D; }
  .user-bar { display: flex; align-items: center; gap: 10px; }
  .user-email { font-size: 12px; color: var(--text-secondary); }
  .logout-btn {
    font-size: 12px; padding: 5px 12px; border-radius: var(--radius-md);
    border: 0.5px solid var(--border-mid); background: var(--bg-secondary);
    color: var(--text-secondary); cursor: pointer; transition: background 0.15s;
  }
  .logout-btn:hover { background: var(--bg-tertiary); }
  .form-card { background: var(--bg-primary); border: 0.5px solid var(--border-light); border-radius: var(--radius-lg); padding: 1.25rem; margin-bottom: 1.5rem; }
  .section-title { font-size: 11px; font-weight: 500; color: var(--text-secondary); letter-spacing: 0.07em; text-transform: uppercase; margin-bottom: 12px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  @media (max-width: 500px) { .form-grid { grid-template-columns: 1fr; } }
  .form-field { display: flex; flex-direction: column; gap: 5px; }
  .form-field label { font-size: 12px; color: var(--text-secondary); }
  .form-field input, .form-field select {
    font-size: 13px; height: 36px; padding: 0 10px;
    border-radius: var(--radius-md); border: 0.5px solid var(--border-mid);
    background: var(--bg-primary); color: var(--text-primary);
  }
  .form-field input:focus, .form-field select:focus { outline: none; border-color: #378ADD; box-shadow: 0 0 0 2px rgba(55,138,221,0.15); }
  .day-row { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 4px; }
  .day-btn { padding: 5px 13px; border-radius: var(--radius-md); border: 0.5px solid var(--border-mid); background: var(--bg-primary); color: var(--text-secondary); font-size: 12px; cursor: pointer; transition: all 0.15s; }
  .day-btn.selected { background: #E6F1FB; border-color: #378ADD; color: #185FA5; font-weight: 500; }
  .day-btn.uncertain.selected { background: #FAEEDA; border-color: #BA7517; color: #854F0B; }
  .submit-btn { margin-top: 14px; width: 100%; padding: 9px; border-radius: var(--radius-md); border: 0.5px solid var(--border-mid); background: var(--bg-secondary); color: var(--text-primary); font-size: 13px; font-weight: 500; cursor: pointer; transition: background 0.15s; }
  .submit-btn:hover { background: var(--bg-tertiary); }
  .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .msg { font-size: 12px; border-radius: var(--radius-md); padding: 6px 10px; margin-top: 8px; display: none; }
  .msg.success { color: #3B6D11; background: #EAF3DE; }
  .msg.error { color: #A32D2D; background: #FCEBEB; }
  .schedule-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 12px; background: var(--bg-primary); border-radius: var(--radius-lg); overflow: hidden; }
  th { background: var(--bg-secondary); padding: 8px 6px; text-align: center; font-weight: 500; font-size: 11px; border: 0.5px solid var(--border-light); color: var(--text-secondary); }
  td { border: 0.5px solid var(--border-light); padding: 4px; vertical-align: top; }
  .time-label { background: var(--bg-secondary); text-align: center; font-size: 11px; color: var(--text-secondary); font-weight: 500; width: 72px; }
  .period-header { background: var(--bg-tertiary); text-align: center; font-size: 11px; font-weight: 500; color: var(--text-secondary); padding: 5px 4px; }
  .patient-chip { background: #E6F1FB; border: 0.5px solid #B5D4F4; border-radius: 5px; padding: 3px 5px; margin: 2px 0; display: block; }
  .patient-chip .p-name { font-weight: 500; color: #185FA5; font-size: 11px; }
  .patient-chip .p-id { color: #185FA5; font-size: 10px; opacity: 0.8; }
  .patient-chip .p-pts { font-size: 10px; color: #378ADD; }
  .patient-chip .remove-btn { float: right; cursor: pointer; color: #378ADD; font-size: 11px; background: none; border: none; padding: 0; margin-left: 4px; opacity: 0.6; }
  .patient-chip .remove-btn:hover { opacity: 1; }
  .uncertain-chip { background: #FAEEDA !important; border-color: #FAC775 !important; }
  .uncertain-chip .p-name, .uncertain-chip .p-id, .uncertain-chip .p-pts, .uncertain-chip .remove-btn { color: #854F0B !important; }
  .subtotal-row td { background: #EAF3DE; font-size: 11px; font-weight: 500; color: #3B6D11; text-align: center; padding: 4px; border: 0.5px solid #C0DD97; }
  .total-row td { background: #E6F1FB; font-size: 12px; font-weight: 500; color: #185FA5; text-align: center; padding: 5px 4px; border: 0.5px solid #B5D4F4; }
  .empty-cell { color: var(--text-tertiary); text-align: center; font-size: 11px; padding: 8px 0; display: block; }
  .loading-overlay { text-align: center; padding: 2rem; color: var(--text-secondary); font-size: 13px; }
</style>
</head>
<body>

<!-- 登入畫面 -->
<div id="login-screen">
  <div class="login-card">
    <h2>復健治療排程系統</h2>
    <p>請登入以繼續使用</p>
    <div class="login-field">
      <label>電子郵件</label>
      <input type="email" id="l-email" placeholder="your@email.com" />
    </div>
    <div class="login-field">
      <label>密碼</label>
      <input type="password" id="l-pass" placeholder="••••••••" />
    </div>
    <button class="login-btn" id="login-btn" onclick="doLogin()">登入</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<!-- 主畫面 -->
<div id="main-screen">
  <div class="container">
    <div class="topbar">
      <h1>
        復健治療排程系統
        <span class="sync-status connecting" id="sync-status">
          <i class="ti ti-loader" style="font-size:13px;"></i> 連線中...
        </span>
      </h1>
      <div class="user-bar">
        <span class="user-email" id="user-email"></span>
        <button class="logout-btn" onclick="doLogout()">登出</button>
      </div>
    </div>

    <div class="form-card">
      <p class="section-title">新增病患排程</p>
      <div class="form-grid">
        <div class="form-field">
          <label>患者姓名</label>
          <input type="text" id="f-name" placeholder="例：王小明" />
        </div>
        <div class="form-field">
          <label>病歷號碼</label>
          <input type="text" id="f-id" placeholder="例：A123456" />
        </div>
        <div class="form-field">
          <label>健保點值</label>
          <select id="f-pts">
            <option value="">請選擇</option>
            <option value="320">320 點</option>
            <option value="480">480 點</option>
            <option value="600">600 點</option>
          </select>
        </div>
        <div class="form-field">
          <label>安排時段</label>
          <select id="f-time">
            <option value="">請選擇</option>
            <optgroup label="上午">
              <option value="08:00">08:00 – 09:00</option>
              <option value="09:00">09:00 – 10:00</option>
              <option value="10:00">10:00 – 11:00</option>
            </optgroup>
            <optgroup label="下午">
              <option value="13:00">13:00 – 14:00</option>
              <option value="14:00">14:00 – 15:00</option>
              <option value="15:00">15:00 – 16:00</option>
            </optgroup>
          </select>
        </div>
      </div>
      <div class="form-field">
        <label>安排星期（可複選）</label>
        <div class="day-row" id="day-row">
          <button class="day-btn" data-day="1">週一</button>
          <button class="day-btn" data-day="2">週二</button>
          <button class="day-btn" data-day="3">週三</button>
          <button class="day-btn" data-day="4">週四</button>
          <button class="day-btn" data-day="5">週五</button>
          <button class="day-btn uncertain" data-day="0">不確定</button>
        </div>
      </div>
      <button class="submit-btn" id="submit-btn" onclick="addPatient()" disabled>＋ 加入排程</button>
      <div class="msg" id="msg"></div>
    </div>

    <p class="section-title">週間排程預覽</p>
    <div id="table-wrap" class="schedule-wrap">
      <div class="loading-overlay"><i class="ti ti-loader"></i> 載入資料中...</div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, orderBy } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

const firebaseConfig = {
  apiKey: "AIzaSyDoE3gLtmz49AAa7catGK4AoJNUyEXlxhM",
  authDomain: "rehab-schedule-b844b.firebaseapp.com",
  projectId: "rehab-schedule-b844b",
  storageBucket: "rehab-schedule-b844b.firebasestorage.app",
  messagingSenderId: "136536263185",
  appId: "1:136536263185:web:b88fcdf403d49216977fb0"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const colRef = collection(db, 'patients');

const AM_TIMES = ['08:00','09:00','10:00'];
const PM_TIMES = ['13:00','14:00','15:00'];
const DAY_KEYS = [1,2,3,4,5,0];
const TIME_LABELS = {
  '08:00':'08:00–09:00','09:00':'09:00–10:00','10:00':'10:00–11:00',
  '13:00':'13:00–14:00','14:00':'14:00–15:00','15:00':'15:00–16:00'
};

let patients = [];
let selectedDays = new Set();
let unsubscribe = null;

// ── 登入/登出 ──
window.doLogin = async function() {
  const email = document.getElementById('l-email').value.trim();
  const pass = document.getElementById('l-pass').value;
  const btn = document.getElementById('login-btn');
  const err = document.getElementById('login-err');
  err.style.display = 'none';
  btn.disabled = true; btn.textContent = '登入中...';
  try {
    await signInWithEmailAndPassword(auth, email, pass);
  } catch(e) {
    const msgs = {
      'auth/invalid-email': '電子郵件格式不正確',
      'auth/user-not-found': '此帳號不存在',
      'auth/wrong-password': '密碼錯誤',
      'auth/invalid-credential': '帳號或密碼錯誤',
      'auth/too-many-requests': '嘗試次數過多，請稍後再試'
    };
    err.textContent = msgs[e.code] || '登入失敗：' + e.message;
    err.style.display = 'block';
  }
  btn.disabled = false; btn.textContent = '登入';
};

window.doLogout = async function() {
  if (unsubscribe) unsubscribe();
  await signOut(auth);
};

// Enter 鍵觸發登入
document.getElementById('l-pass').addEventListener('keydown', e => {
  if (e.key === 'Enter') window.doLogin();
});

// ── 監聽登入狀態 ──
onAuthStateChanged(auth, user => {
  if (user) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('main-screen').style.display = 'block';
    document.getElementById('user-email').textContent = user.email;
    startListening();
  } else {
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('main-screen').style.display = 'none';
    document.getElementById('table-wrap').innerHTML = '<div class="loading-overlay">載入資料中...</div>';
  }
});

function startListening() {
  if (unsubscribe) unsubscribe();
  const q = query(colRef, orderBy('createdAt'));
  unsubscribe = onSnapshot(q,
    snapshot => {
      patients = snapshot.docs.map(d => ({ docId: d.id, ...d.data() }));
      setStatus('connected', '即時同步中');
      document.getElementById('submit-btn').disabled = false;
      renderTable();
    },
    err => {
      setStatus('error', '連線失敗');
      console.error(err);
    }
  );
}

function setStatus(state, text) {
  const el = document.getElementById('sync-status');
  el.className = 'sync-status ' + state;
  const icons = { connected: 'ti-cloud-check', connecting: 'ti-loader', error: 'ti-cloud-off' };
  el.innerHTML = `<i class="ti ${icons[state]}" style="font-size:13px;"></i> ${text}`;
}

function showMsg(txt, type='success') {
  const m = document.getElementById('msg');
  m.textContent = txt; m.className = 'msg ' + type; m.style.display = 'block';
  setTimeout(() => m.style.display = 'none', 2500);
}

document.querySelectorAll('.day-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const d = btn.dataset.day;
    if (selectedDays.has(d)) { selectedDays.delete(d); btn.classList.remove('selected'); }
    else { selectedDays.add(d); btn.classList.add('selected'); }
  });
});

window.addPatient = async function() {
  const name = document.getElementById('f-name').value.trim();
  const pid = document.getElementById('f-id').value.trim();
  const pts = document.getElementById('f-pts').value;
  const time = document.getElementById('f-time').value;
  if (!name || !pid || !pts || !time || selectedDays.size === 0) {
    showMsg('請填寫所有欄位並選擇至少一個星期', 'error'); return;
  }
  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  try {
    for (const day of selectedDays) {
      await addDoc(colRef, { name, pid, pts: parseInt(pts), time, day: parseInt(day), createdAt: Date.now() });
    }
    document.getElementById('f-name').value = '';
    document.getElementById('f-id').value = '';
    document.getElementById('f-pts').value = '';
    document.getElementById('f-time').value = '';
    selectedDays.clear();
    document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('selected'));
    showMsg('排程已新增並同步！');
  } catch(e) {
    showMsg('新增失敗：' + e.message, 'error');
  }
  btn.disabled = false;
};

window.removePatient = async function(docId) {
  try {
    await deleteDoc(doc(db, 'patients', docId));
  } catch(e) {
    showMsg('刪除失敗：' + e.message, 'error');
  }
};

function cellContent(time, dayKey) {
  const pts = patients.filter(p => p.time === time && p.day === dayKey);
  if (!pts.length) return '<span class="empty-cell">–</span>';
  return pts.map(p =>
    `<span class="patient-chip${dayKey===0?' uncertain-chip':''}">
      <button class="remove-btn" onclick="removePatient('${p.docId}')" title="移除">✕</button>
      <span class="p-name">${p.name}</span><br>
      <span class="p-id">${p.pid}</span>
      <span class="p-pts"> · ${p.pts}點</span>
    </span>`
  ).join('');
}

function renderTable() {
  const wrap = document.getElementById('table-wrap');
  let html = '<table><thead><tr><th style="width:72px;"></th>';
  ['週一','週二','週三','週四','週五'].forEach(d => html += `<th>${d}</th>`);
  html += '<th style="width:62px;">不確定</th></tr></thead><tbody>';

  html += '<tr><td class="time-label period-header"></td><td class="period-header" colspan="5">上午</td><td class="period-header">上午</td></tr>';
  AM_TIMES.forEach(t => {
    html += `<tr><td class="time-label">${TIME_LABELS[t]}</td>`;
    DAY_KEYS.forEach(d => html += `<td>${cellContent(t, d)}</td>`);
    html += '</tr>';
  });
  html += '<tr class="subtotal-row"><td class="time-label" style="background:#EAF3DE;color:#3B6D11;">上午小計</td>';
  DAY_KEYS.forEach(d => {
    const s = patients.filter(p => AM_TIMES.includes(p.time) && p.day===d).reduce((a,p)=>a+p.pts,0);
    html += `<td>${s>0?s+'點':'–'}</td>`;
  });
  html += '</tr>';

  html += '<tr><td class="time-label period-header"></td><td class="period-header" colspan="5">下午</td><td class="period-header">下午</td></tr>';
  PM_TIMES.forEach(t => {
    html += `<tr><td class="time-label">${TIME_LABELS[t]}</td>`;
    DAY_KEYS.forEach(d => html += `<td>${cellContent(t, d)}</td>`);
    html += '</tr>';
  });
  html += '<tr class="subtotal-row"><td class="time-label" style="background:#EAF3DE;color:#3B6D11;">下午小計</td>';
  DAY_KEYS.forEach(d => {
    const s = patients.filter(p => PM_TIMES.includes(p.time) && p.day===d).reduce((a,p)=>a+p.pts,0);
    html += `<td>${s>0?s+'點':'–'}</td>`;
  });
  html += '</tr>';

  html += '<tr class="total-row"><td class="time-label" style="background:#E6F1FB;color:#185FA5;">當日總計</td>';
  DAY_KEYS.forEach(d => {
    const s = patients.filter(p=>p.day===d).reduce((a,p)=>a+p.pts,0);
    html += `<td>${s>0?'<strong>'+s+'點</strong>':'–'}</td>`;
  });
  html += '</tr></tbody></table>';
  wrap.innerHTML = html;
}
</script>
</body>
</html>
